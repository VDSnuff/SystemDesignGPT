name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: Test, lint, generated content, audit, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:generated
      - run: npm run check:evidence-freshness
      - run: npm run check:supply-chain
      - run: npm run build
      - run: npm run check:performance:d1
      - run: npm run check:recovery:d1
      - run: git diff --check
      - name: Upload supply-chain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: supply-chain-${{ github.run_id }}
          path: outputs/supply-chain/
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload D1 validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: d1-validation-${{ github.run_id }}
          path: performance-results/local-d1-*.json
          if-no-files-found: ignore
          retention-days: 30

  browser:
    name: Responsive browser contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit
      - run: npx playwright install --with-deps chromium
      - name: Run browser contracts with resource diagnostics
        run: /usr/bin/time --verbose npm run test:e2e
      - run: npm run check:links
      - run: npm run build
      - run: npm run test:e2e:visual
      - run: npm run check:performance
      - name: Upload performance evidence
        if: ${{ always() && hashFiles('performance-results/**') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: performance-${{ github.run_id }}
          path: performance-results/
          if-no-files-found: error
          retention-days: 30
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
